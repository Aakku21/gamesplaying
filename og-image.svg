<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- City Silhouette -->
  <path d="M 0 450 L 50 450 L 50 320 L 140 320 L 140 450 L 220 450 L 220 280 L 320 280 L 320 450 L 400 450 L 400 240 L 520 240 L 520 450 L 620 450 L 620 300 L 740 300 L 740 450 L 850 450 L 850 260 L 980 260 L 980 450 L 1060 450 L 1060 330 L 1200 330 L 1200 630 L 0 630 Z" fill="#0f172a" opacity="0.8" />
  
  <!-- Road -->
  <rect y="480" width="1200" height="150" fill="#020617" />
  <line x1="0" y1="482" x2="1200" y2="482" stroke="#38bdf8" stroke-width="4" opacity="0.6" />
  
  <!-- Glowing Road Stripes -->
  <line x1="100" y1="550" x2="250" y2="550" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  <line x1="450" y1="550" x2="600" y2="550" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  <line x1="800" y1="550" x2="950" y2="550" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.7" />

  <!-- Title Badge -->
  <rect x="360" y="70" width="480" height="42" rx="21" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="2" />
  <text x="600" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">⚡ FREE ENDLESS RUNNER ARCADE</text>

  <!-- Main Headline -->
  <text x="600" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">URBAN ESCAPE</text>
  <text x="600" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">BOY VS POLICE RUNNER</text>

  <!-- Tagline -->
  <text x="600" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Jump Middle Blockers • Slide Under Beams • Skate &amp; Escape the Law!</text>

  <!-- Boy Runner Avatar Icon -->
  <g transform="translate(680, 360)">
    <circle cx="50" cy="40" r="30" fill="#facc15" />
    <text x="50" y="55" font-size="44" text-anchor="middle">🏃‍♂️</text>
    <text x="50" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">STREET BOY</text>
  </g>

  <!-- VS Text -->
  <text x="600" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#ef4444" text-anchor="middle">VS</text>

  <!-- Police Chaser Avatar Icon -->
  <g transform="translate(420, 360)">
    <circle cx="50" cy="40" r="30" fill="#3b82f6" />
    <text x="50" y="55" font-size="44" text-anchor="middle">👮‍♂️</text>
    <text x="50" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">POLICE CHASER</text>
  </g>

  <!-- Badges at bottom -->
  <rect x="220" y="470" width="180" height="36" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
  <text x="310" y="493" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">✔ 100% FREE TO PLAY</text>

  <rect x="430" y="470" width="180" height="36" rx="8" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="520" y="493" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#06b6d4" text-anchor="middle">✔ NO DOWNLOAD REQUIRED</text>

  <rect x="640" y="470" width="180" height="36" rx="8" fill="rgba(250, 204, 21, 0.2)" stroke="#facc15" stroke-width="1.5" />
  <text x="730" y="493" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#facc15" text-anchor="middle">✔ MOBILE &amp; PC READY</text>

  <rect x="850" y="470" width="140" height="36" rx="8" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1.5" />
  <text x="920" y="493" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">✔ UNBLOCKED</text>
</svg>
